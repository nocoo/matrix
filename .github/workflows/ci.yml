name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  ci:
    uses: nocoo/base-ci/.github/workflows/quality.yml@3d2e9e55fdd60aa756df454ded53ef6d06d6653f
    with:
      runtime-version: "1.4.2"
      install-policy: "trusted"
      coverage-path: "coverage"
      prepare-command: "bun run build"
      test-command: "bun run test:coverage"
      typecheck: false
      disabled-check-reasons: '{"typecheck": "previous CI used a no-op typecheck-command"}'
    secrets: inherit
